<div style="
    width: 1024px; height: 600px;
    background: #111827;
    display: flex; flex-direction: column;
">
    <!-- Header -->
    <div style="
        height: 72px; background: #E79124;
        display: flex; align-items: center; justify-content: space-between; padding: 0 32px;
        flex-shrink: 0;
    ">
        <span id="payment-title" style="font-size: 1.7rem; font-weight: bold; color: white; letter-spacing: 2px;">Payment</span>
        <div style="color: white; font-size: 1.5rem; font-weight: bold; background: rgba(0,0,0,0.2); padding: 8px 16px; border-radius: 8px;">
            <span id="payment-balance-label">Balance</span>: <span class="global-balance-display">0</span> <span class="currency-unit">THB</span>
        </div>
    </div>

    <!-- Content -->
    <div style="
        flex: 1;
        display: flex; flex-direction: column;
        justify-content: center; align-items: center;
        gap: 40px;
    ">
        <p id="payment-choose-label" style="color: #9CA3AF; font-size: 1.5rem; font-weight: bold; letter-spacing: 2px;">Select payment method</p>

        <div style="display: flex; gap: 40px;">

            <button style="
                width: 300px; height: 150px;
                background: #1E2836; color: #F3F4F6;
                border: 2px solid #374151; border-radius: 16px;
                font-size: 2.2rem; font-weight: bold; letter-spacing: 2px;
                cursor: pointer;
            "
                onmousedown="this.style.filter='brightness(0.7)'"
                onmouseup="this.style.filter=''"
                onclick="navTo('/page/cash{% if mode %}?mode={{ mode }}{% endif %}', '[State] cash')"
            ><span id="payment-cash-label">Cash</span></button>

            <button style="
                width: 300px; height: 150px;
                background: #1E2836; color: #F3F4F6;
                border: 2px solid #374151; border-radius: 16px;
                font-size: 2rem; font-weight: bold; letter-spacing: 2px;
                cursor: pointer;
            "
                onmousedown="this.style.filter='brightness(0.7)'"
                onmouseup="this.style.filter=''"
                onclick="navTo('/page/qr{% if mode %}?mode={{ mode }}{% endif %}', '[State] qr')"
            >QR Code</button>

        </div>

        <button style="
            background: transparent; color: #9CA3AF;
            border: 1px solid #374151; border-radius: 12px;
            font-size: 1.3rem; padding: 20px 64px;
            cursor: pointer; margin-top: 8px;
        "
            onmousedown="this.style.filter='brightness(0.7)'"
            onmouseup="this.style.filter=''"
            onclick="navTo('{% if mode == 'topup' %}/page/operation_{{ machine_system }}{% else %}/page/home{% endif %}', '{% if mode == 'topup' %}[State] operation{% else %}[State] Home{% endif %}')"
        ><span id="payment-back-label">Back</span></button>
    </div>

    <!-- Finish overlay -->
    <div id="finish-overlay" style="display:none; position:absolute; inset:0; background:#111827; justify-content:center; align-items:center; flex-direction:column; gap:40px; z-index:100;">
        <h2 id="payment-completed-label" style="color:#10B981; font-size:6rem; font-weight:bold; letter-spacing:8px; margin:0; text-transform:uppercase; text-shadow:0 0 20px rgba(16,185,129,0.5);">COMPLETED</h2>
        <p id="payment-returning-label" style="color:white; font-size:1.5rem;">Returning to Home...</p>
    </div>
</div>

<script>
    (function initPaymentLanguage() {
        const i18n = {
            en: { title:'Payment', balance:'Balance', choose:'Select payment method', cash:'Cash', back:'Back', completed:'COMPLETED', returning:'Returning to Home...' },
            th: { title:'\u0e0a\u0e33\u0e23\u0e30\u0e40\u0e07\u0e34\u0e19', balance:'\u0e22\u0e2d\u0e14\u0e40\u0e07\u0e34\u0e19\u0e04\u0e07\u0e40\u0e2b\u0e25\u0e37\u0e2d', choose:'\u0e40\u0e25\u0e37\u0e2d\u0e01\u0e27\u0e34\u0e18\u0e35\u0e01\u0e32\u0e23\u0e0a\u0e33\u0e23\u0e30\u0e40\u0e07\u0e34\u0e19', cash:'\u0e40\u0e07\u0e34\u0e19\u0e2a\u0e14', back:'\u0e01\u0e25\u0e31\u0e1a', completed:'\u0e2a\u0e33\u0e40\u0e23\u0e47\u0e08', returning:'\u0e01\u0e33\u0e25\u0e31\u0e07\u0e01\u0e25\u0e31\u0e1a\u0e2b\u0e19\u0e49\u0e32\u0e2b\u0e25\u0e31\u0e01...' },
            lo: { title:'\u0e8a\u0eb3\u0ea5\u0eb0\u0ec0\u0e87\u0eb4\u0e99', balance:'\u0e8d\u0ead\u0e94\u0ec0\u0e87\u0eb4\u0e99\u0e84\u0ebb\u0e87\u0ec0\u0eab\u0ebc\u0eb7\u0ead', choose:'\u0ec0\u0ea5\u0eb7\u0ead\u0e81\u0ea7\u0eb4\u0e97\u0eb5\u0e8a\u0eb3\u0ea5\u0eb0\u0ec0\u0e87\u0eb4\u0e99', cash:'\u0ec0\u0e87\u0eb4\u0e99\u0eaa\u0ebb\u0e94', back:'\u0e81\u0eb1\u0e9a', completed:'\u0eaa\u0eb3\u0ec0\u0ea5\u0eb1\u0e94', returning:'\u0e81\u0eb3\u0ea5\u0eb1\u0e87\u0e81\u0eb1\u0e9a\u0edc\u0ec9\u0eb2\u0eab\u0ebc\u0eb1\u0e81...' }
        };
        const setText = (id, text) => { const el = document.getElementById(id); if (el) el.innerText = text; };
        fetch('/api/settings?t=' + Date.now()).then(r=>r.json()).then(config => {
            let lang = config.language || config.lang || 'en';
            if (!i18n[lang]) lang = 'en';
            const t = i18n[lang];
            setText('payment-title', t.title);
            setText('payment-balance-label', t.balance);
            setText('payment-choose-label', t.choose);
            setText('payment-cash-label', t.cash);
            setText('payment-back-label', t.back);
            setText('payment-completed-label', t.completed);
            setText('payment-returning-label', t.returning);
            document.querySelectorAll('.currency-unit').forEach(el => { el.innerText = (config.currency || config.money_system || 'THB').toUpperCase() === 'LAK' ? 'LAK' : 'THB'; });
        }).catch(()=>{});
    })();

    function navTo(url, uartMsg) {
        if(uartMsg) fetch('/api/uart_send?msg=' + encodeURIComponent(uartMsg));
        htmx.ajax('GET', url, {target: '#content'});
    }

    (function() {
        // --- Touch Event to ESP ---
        function sendTouchToESP() {
            fetch('/api/uart_send?msg=' + encodeURIComponent('[Action] Touch'));
        }
        const events = ['mousedown', 'touchstart'];
        events.forEach(evt => document.addEventListener(evt, sendTouchToESP, {passive: true}));

        document.addEventListener('htmx:beforeSwap', function cleanup() {
            events.forEach(evt => document.removeEventListener(evt, sendTouchToESP));
            document.removeEventListener('htmx:beforeSwap', cleanup);
        });

        // --- UART STATE POLLING ---
        let lastSeenStateSeq = 0;
        let isTransitioning = false;

        // Initialize seq to current to avoid triggering on old events
        fetch('/api/action_state').then(res => res.json()).then(d => {
            if (d.state_event) lastSeenStateSeq = d.state_event.seq;
        }).catch(()=>{});

        setInterval(async () => {
            if (isTransitioning) return;
            try {
                const res = await fetch('/api/action_state');
                const d   = await res.json();
                if (d.state_event && d.state_event.seq > lastSeenStateSeq) {
                    lastSeenStateSeq = d.state_event.seq;
                    if (d.state_event.name === 'Home') {
                        handleStateHome();
                    }
                }
            } catch(e) {}
        }, 800);

        function handleStateHome() {
            if (isTransitioning) return;
            isTransitioning = true;
            htmx.ajax('GET', '/page/home', {target: '#content'});
        }
    })();
</script>
