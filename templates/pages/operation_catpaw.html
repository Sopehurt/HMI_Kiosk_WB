<div style="width:1024px; height:600px; background:#111827; display:flex; flex-direction:column; font-family: sans-serif; overflow:hidden;">
    <!-- Header -->
    <div style="height:72px; background:#E79124; flex-shrink:0; display:flex; align-items:center; justify-content:space-between; padding:0 32px;">
        <span id="cp-title" style="font-size:1.8rem; font-weight:bold; color:white; letter-spacing:1px;">CATPAW Operation</span>
        <div style="color:white; font-size:1.3rem; font-weight:bold; background:rgba(0,0,0,0.2); padding:8px 20px; border-radius:12px;">
            <span id="cp-balance-label">Balance</span>: <span class="global-balance-display">0</span> <span class="currency-unit">THB</span>
        </div>
    </div>

    <!-- Main Content Area -->
    <div style="flex:1; display:flex; padding:40px; gap:40px; overflow:hidden;">
        
        <!-- Left Column: Function List -->
        <div id="function-list" style="flex:1.2; display:flex; flex-direction:column; justify-content:center; gap:25px;">
            <!-- Circles rendered via JS -->
        </div>

        <!-- Right Column: Status & Timer -->
        <div style="flex:1; display:flex; flex-direction:column; gap:24px;">
            <!-- Big Box -->
            <div style="flex:1; background:#1E2836; border-radius:32px; border:1px solid #374151; display:flex; flex-direction:column; justify-content:center; align-items:center;">
                <span id="status-text" style="color:#9CA3AF; font-size:2rem; font-weight:bold; margin-bottom:15px; letter-spacing:2px; text-transform:uppercase;">Running</span>
                <div style="display:flex; align-items:baseline;">
                    <span id="main-timer" style="font-size:10rem; font-weight:bold; color:white; line-height:1; font-family:monospace;">--</span>
                    <span id="cp-sec-label" style="font-size:2rem; color:#9CA3AF; font-weight:bold; margin-left:15px; letter-spacing:2px;">SEC</span>
                </div>
            </div>

            <!-- Controls -->
            <div style="display:flex; gap:20px; height:120px;">
                <button onclick="document.getElementById('confirm-finish-overlay').style.display='flex'" style="
                    flex:1; background:#EF4444; border:none; border-radius:24px;
                    color:white; font-size:2.5rem; font-weight:bold; cursor:pointer; letter-spacing: 2px;
                "><span id="cp-finish-early-label">FINISH EARLY</span></button>
            </div>
        </div>
    </div>

    <!-- Finish overlay -->
    <div id="finish-overlay" style="display:none; position:absolute; inset:0; background:#111827; z-index:300; justify-content:center; align-items:center; flex-direction:column; gap:40px;">
        <h2 id="cp-completed-label" style="color:#10B981; font-size:6rem; font-weight:bold; letter-spacing:10px; margin:0;">COMPLETED</h2>
        <button id="cp-return-home-btn" style="background:#3B82F6; border:none; border-radius:16px; color:white; font-size:2rem; font-weight:bold; padding:20px 80px; cursor:pointer;" onclick="navTo('/page/home')">Return to Home</button>
    </div>

    <!-- Confirm Finish overlay -->
    <div id="confirm-finish-overlay" style="display:none; position:absolute; inset:0; background:rgba(17,24,39,0.95); z-index:400; justify-content:center; align-items:center; flex-direction:column; gap:40px;">
        <h2 id="cp-confirm-title" style="color:white; font-size:4rem; font-weight:bold; letter-spacing:2px; margin:0; text-align:center;">Are you sure you want to finish early?</h2>
        <div style="display:flex; gap:30px; margin-top:20px;">
            <button id="cp-cancel-btn" style="background:#4B5563; border:none; border-radius:16px; color:white; font-size:2rem; font-weight:bold; padding:25px 60px; cursor:pointer;" onclick="document.getElementById('confirm-finish-overlay').style.display='none'">CANCEL</button>
            <button id="cp-confirm-btn" style="background:#EF4444; border:none; border-radius:16px; color:white; font-size:2rem; font-weight:bold; padding:25px 60px; cursor:pointer;" onclick="document.getElementById('confirm-finish-overlay').style.display='none'; cpForceFinish();">CONFIRM FINISH</button>
        </div>
    </div>

    <!-- Door Open Overlay -->
    <div id="door-overlay" style="display:none; position:absolute; inset:0; background:rgba(17,24,39,0.98); z-index:500; justify-content:center; align-items:center; flex-direction:column; gap:30px;">
        <h2 id="cp-door-title" style="color:#EF4444; font-size:6rem; font-weight:bold; letter-spacing:2px; margin:0; text-align:center;">DOOR OPENED</h2>
        <h3 id="cp-door-msg" style="color:white; font-size:3.5rem; font-weight:bold; margin:0; text-align:center;">Please close the door to continue</h3>
    </div>
</div>

<style>
    .fn-row { display: flex; align-items: center; gap:30px; }
    .fn-circle {
        width: 50px; height: 50px; border-radius: 50%;
        background: #374151; border: 4px solid #1F2937;
        flex-shrink: 0;
    }
    .fn-text { color: white; font-size: 2.2rem; font-weight: bold; }
    .circle-running { background: #FBBF24 !important; border-color: #FDE047 !important; }
    .circle-finished { background: #10B981 !important; border-color: #34D399 !important; }
    * { transition: none !important; animation: none !important; }
</style>

<script>
    (function() {
        const fns = [
            {id:'uv_ozone', key:'uv', match:'uv'},
            {id:'dust', key:'dust', match:'dust'},
            {id:'bact', key:'bact', match:'bact'},
            {id:'dry', key:'dry', match:'dry'},
            {id:'perfume', key:'perfume', match:'perfume'}
        ];

        let timeLeft = 0;
        let isPaused = false;
        let timerStarted = false;
        let lastActionSeq = Date.now() / 1000; // Ignore history from previous sessions
        let lastSchedSeq = 0;
        let lang = 'en';
        const mode = '{{ mode|default("shoe") }}';
        const i18n = {
            en: { title:'CATPAW Operation', balance:'Balance', running:'RUNNING', paused:'PAUSED', completed:'COMPLETED', sec:'SEC', finishEarly:'FINISH EARLY', returnHome:'Return to Home', confirmTitle:'Are you sure you want to finish early?', cancel:'CANCEL', confirm:'CONFIRM FINISH', doorTitle:'DOOR OPENED', doorMsg:'Please close the door to continue', fns:{uv:'UV and Ozone', dust:'Dust Blow', bact:'Bacteria Disinfection', dry:'Hot Air Dry', perfumeShoe:'Shoe Perfume', perfumeHelmet:'Helmet Perfume'} },
            th: { title:'\u0e01\u0e32\u0e23\u0e17\u0e33\u0e07\u0e32\u0e19 CATPAW', balance:'\u0e22\u0e2d\u0e14\u0e40\u0e07\u0e34\u0e19\u0e04\u0e07\u0e40\u0e2b\u0e25\u0e37\u0e2d', running:'\u0e01\u0e33\u0e25\u0e31\u0e07\u0e17\u0e33\u0e07\u0e32\u0e19', paused:'\u0e1e\u0e31\u0e01', completed:'\u0e2a\u0e33\u0e40\u0e23\u0e47\u0e08', sec:'\u0e27\u0e34', finishEarly:'\u0e2a\u0e34\u0e49\u0e19\u0e2a\u0e38\u0e14\u0e01\u0e48\u0e2d\u0e19', returnHome:'\u0e01\u0e25\u0e31\u0e1a\u0e2b\u0e19\u0e49\u0e32\u0e2b\u0e25\u0e31\u0e01', confirmTitle:'\u0e22\u0e37\u0e19\u0e22\u0e31\u0e19\u0e2a\u0e34\u0e49\u0e19\u0e2a\u0e38\u0e14\u0e01\u0e48\u0e2d\u0e19\u0e40\u0e27\u0e25\u0e32?', cancel:'\u0e22\u0e01\u0e40\u0e25\u0e34\u0e01', confirm:'\u0e22\u0e37\u0e19\u0e22\u0e31\u0e19', doorTitle:'\u0e1b\u0e23\u0e30\u0e15\u0e39\u0e40\u0e1b\u0e34\u0e14', doorMsg:'\u0e01\u0e23\u0e38\u0e13\u0e32\u0e1b\u0e34\u0e14\u0e15\u0e39\u0e49\u0e40\u0e1e\u0e37\u0e48\u0e2d\u0e17\u0e33\u0e07\u0e32\u0e19\u0e15\u0e48\u0e2d', fns:{uv:'\u0e2d\u0e1a\u0e14\u0e49\u0e27\u0e22 UV \u0e41\u0e25\u0e30\u0e42\u0e2d\u0e42\u0e0b\u0e19', dust:'\u0e40\u0e1b\u0e48\u0e32\u0e1d\u0e38\u0e48\u0e19', bact:'\u0e06\u0e48\u0e32\u0e40\u0e0a\u0e37\u0e49\u0e2d\u0e41\u0e1a\u0e04\u0e17\u0e35\u0e40\u0e23\u0e35\u0e22', dry:'\u0e2d\u0e1a\u0e41\u0e2b\u0e49\u0e07\u0e14\u0e49\u0e27\u0e22\u0e25\u0e21\u0e23\u0e49\u0e2d\u0e19', perfumeShoe:'\u0e2d\u0e1a\u0e23\u0e2d\u0e07\u0e40\u0e17\u0e49\u0e32\u0e14\u0e49\u0e27\u0e22\u0e19\u0e49\u0e33\u0e2b\u0e2d\u0e21', perfumeHelmet:'\u0e2d\u0e1a\u0e2b\u0e21\u0e27\u0e01\u0e14\u0e49\u0e27\u0e22\u0e19\u0e49\u0e33\u0e2b\u0e2d\u0e21'} },
            lo: { title:'\u0e81\u0eb2\u0e99\u0ec0\u0eae\u0eb1\u0e94\u0ea7\u0ebd\u0e81 CATPAW', balance:'\u0e8d\u0ead\u0e94\u0ec0\u0e87\u0eb4\u0e99\u0e84\u0ebb\u0e87\u0ec0\u0eab\u0ebc\u0eb7\u0ead', running:'\u0e81\u0eb3\u0ea5\u0eb1\u0e87\u0ec0\u0eae\u0eb1\u0e94\u0ea7\u0ebd\u0e81', paused:'\u0e9e\u0eb1\u0e81', completed:'\u0eaa\u0eb3\u0ec0\u0ea5\u0eb1\u0e94', sec:'\u0ea7\u0eb4', finishEarly:'\u0eaa\u0eb4\u0ec9\u0e99\u0eaa\u0eb8\u0e94\u0e81\u0ec8\u0ead\u0e99', returnHome:'\u0e81\u0eb1\u0e9a\u0edc\u0ec9\u0eb2\u0eab\u0ebc\u0eb1\u0e81', confirmTitle:'\u0ea2\u0eb7\u0e99\u0ea2\u0eb1\u0e99\u0eaa\u0eb4\u0ec9\u0e99\u0eaa\u0eb8\u0e94\u0e81\u0ec8\u0ead\u0e99\u0ec0\u0ea7\u0ea5\u0eb2?', cancel:'\u0e8d\u0ebb\u0e81\u0ec0\u0ea5\u0eb5\u0e81', confirm:'\u0ea2\u0eb7\u0e99\u0ea2\u0eb1\u0e99', doorTitle:'\u0e9b\u0eb0\u0e95\u0eb9\u0ec0\u0e9b\u0eb5\u0e94', doorMsg:'\u0e81\u0eb0\u0ea5\u0eb8\u0e99\u0eb2\u0e9b\u0eb4\u0e94\u0e95\u0eb9\u0ec9\u0ec0\u0e9e\u0eb7\u0ec8\u0ead\u0ec0\u0eae\u0eb1\u0e94\u0ea7\u0ebd\u0e81\u0e95\u0ecd\u0ec8', fns:{uv:'\u0ead\u0ebb\u0e9a\u0e94\u0ec9\u0ea7\u0e8d UV \u0ec1\u0ea5\u0eb0\u0ec2\u0ead\u0ec2\u0e8a\u0e99', dust:'\u0ec0\u0e9b\u0ebb\u0ec8\u0eb2\u0e9d\u0eb8\u0ec8\u0e99', bact:'\u0e82\u0ec9\u0eb2\u0ec0\u0e8a\u0eb7\u0ec9\u0ead\u0ec1\u0e9a\u0eb1\u0e81\u0e97\u0eb5\u0ec0\u0ea3\u0e8d', dry:'\u0ead\u0ebb\u0e9a\u0ec1\u0eab\u0ec9\u0e87\u0e94\u0ec9\u0ea7\u0e8d\u0ea5\u0ebb\u0ea1\u0eae\u0ec9\u0ead\u0e99', perfumeShoe:'\u0ead\u0ebb\u0e9a\u0ec0\u0e81\u0eb5\u0e9a\u0e94\u0ec9\u0ea7\u0e8d\u0e99\u0ec9\u0eb3\u0eab\u0ead\u0ea1', perfumeHelmet:'\u0ead\u0ebb\u0e9a\u0edd\u0ea7\u0e81\u0e94\u0ec9\u0ea7\u0e8d\u0e99\u0ec9\u0eb3\u0eab\u0ead\u0ea1'} }
        };
        const tr = (key) => (i18n[lang] && i18n[lang][key]) || i18n.en[key] || key;
        const fnLabel = (key) => {
            const fnsText = (i18n[lang] || i18n.en).fns;
            const finalKey = key === 'perfume' ? (mode === 'helmet' ? 'perfumeHelmet' : 'perfumeShoe') : key;
            return fnsText[finalKey] || i18n.en.fns[finalKey] || finalKey;
        };
        const setText = (id, text) => { const el = document.getElementById(id); if (el) el.innerText = text; };
        function applyLanguage() {
            setText('cp-title', tr('title'));
            setText('cp-balance-label', tr('balance'));
            setText('cp-sec-label', tr('sec'));
            setText('cp-finish-early-label', tr('finishEarly'));
            setText('cp-completed-label', tr('completed'));
            setText('cp-return-home-btn', tr('returnHome'));
            setText('cp-confirm-title', tr('confirmTitle'));
            setText('cp-cancel-btn', tr('cancel'));
            setText('cp-confirm-btn', tr('confirm'));
            setText('cp-door-title', tr('doorTitle'));
            setText('cp-door-msg', tr('doorMsg'));
            document.querySelectorAll('[data-fn-label]').forEach(el => el.innerText = fnLabel(el.getAttribute('data-fn-label')));
            document.getElementById('status-text').innerText = isPaused ? tr('paused') : (timerStarted && timeLeft <= 0 ? tr('completed') : tr('running'));
        }

        // Render functions
        const container = document.getElementById('function-list');
        fns.forEach(f => {
            const div = document.createElement('div');
            div.className = 'fn-row';
            div.innerHTML = `<div class="fn-circle" id="circle-${f.id}"></div><span class="fn-text" data-fn-label="${f.key}">${fnLabel(f.key)}</span>`;
            container.appendChild(div);
        });
        fetch('/api/settings?t=' + Date.now()).then(r=>r.json()).then(config => {
            lang = config.language || config.lang || 'en';
            if (!i18n[lang]) lang = 'en';
            document.querySelectorAll('.currency-unit').forEach(el => { el.innerText = (config.currency || config.money_system || 'THB').toUpperCase() === 'LAK' ? 'LAK' : 'THB'; });
            applyLanguage();
        }).catch(()=>{});

        // Local Timer Logic
        const localTimer = setInterval(() => {
            if (timerStarted && !isPaused && timeLeft > 0) {
                timeLeft--;
                document.getElementById('main-timer').innerText = timeLeft;
                if (timeLeft <= 0) {
                    timerStarted = false;
                    document.getElementById('status-text').innerText = tr('completed');
                    // Return to home properly
                    setTimeout(() => {
                        window.location.href = '/'; 
                    }, 3000);
                }
            }
        }, 1000);

        async function poll() {
            try {
                const res = await fetch('/api/action_state?t=' + Date.now());
                const d = await res.json();
                
                // 1. Schedule
                if (d.schedule_event && d.schedule_event.seq > lastSchedSeq) {
                    lastSchedSeq = d.schedule_event.seq;
                    const totalMatch = d.schedule_event.raw.match(/total:(\d+)/);
                    if (totalMatch) {
                        timeLeft = parseInt(totalMatch[1]);
                        document.getElementById('main-timer').innerText = timeLeft;
                        fetch('/api/uart_send?msg=[Action] Load Schedule Success');
                    }
                }

                // 2. Actions (Process History)
                const history = d.action_history || [];
                history.forEach(evt => {
                    if (evt.seq > lastActionSeq) {
                        lastActionSeq = evt.seq;
                        handleActionEvent(evt.name);
                    }
                });

                // 3. Overall State & Redirection Logic
                if (d.state_event && d.state_event.seq > lastSeenStateSeq) {
                    lastSeenStateSeq = d.state_event.seq;
                    if (d.state_event.name === 'Finish') {
                        document.getElementById('finish-overlay').style.display = 'flex';
                    } else if (d.state_event.name === 'Home') {
                        navTo('/page/home');
                    }
                }
            } catch(e){}
        }

        let lastSeenStateSeq = 0;
        fetch('/api/action_state').then(r=>r.json()).then(d => {
            if(d.state_event) lastSeenStateSeq = d.state_event.seq;
        }).catch(()=>{});

        function handleActionEvent(name) {
            const lowerName = name.toLowerCase();
            console.log("CATPAW Action Received:", name);
            
            if (name.includes('FnOn')) {
                timerStarted = true;
                setCircleState(name, 'circle-running');
            } else if (name.includes('FnOff')) {
                setCircleState(name, 'circle-finished');
            }
            
            if (lowerName.includes('pause') || lowerName.includes('door open')) {
                updatePauseUI(true, lowerName.includes('door open'));
            } else if (lowerName.includes('resume') || lowerName.includes('door close')) {
                updatePauseUI(false, false);
            }
        }

        function updatePauseUI(paused, door) {
            isPaused = paused;
            const st = document.getElementById('status-text');
            const dr = document.getElementById('door-overlay');
            
            if (isPaused) {
                st.innerText = tr('paused');
                dr.style.display = door ? 'flex' : 'none';
            } else {
                st.innerText = tr('running');
                dr.style.display = 'none';
            }
        }

        function setCircleState(rawAction, className) {
            const lowerAction = rawAction.toLowerCase();
            fns.forEach(f => {
                // Precise match for "fn":"name" in JSON string
                const pattern = `\"fn\":\"${f.match}\"`;
                if (lowerAction.includes(pattern)) {
                    const circle = document.getElementById('circle-' + f.id);
                    circle.classList.remove('circle-running', 'circle-finished');
                    circle.classList.add(className);
                }
            });
        }

        window.cpTogglePause = (btn) => {
            // Immediate UI feedback for better UX
            const nextPaused = !isPaused;
            updatePauseUI(nextPaused, false);
            fetch('/api/uart_send?msg=[Action] ' + (nextPaused ? 'Pause' : 'Resume'));
        };

        window.cpForceFinish = () => {
            fetch('/api/uart_send?msg=[State] Finish');
            setTimeout(() => fetch('/api/uart_send?msg=[Action] Finish'), 50);
            document.getElementById('finish-overlay').style.display = 'flex';
        };

        const interval = setInterval(poll, 800);
        document.addEventListener('htmx:beforeSwap', () => {
            clearInterval(interval);
            clearInterval(localTimer);
        }, {once:true});
    })();

    function navTo(url) {
        htmx.ajax('GET', url, {target: '#content'});
    }
</script>
