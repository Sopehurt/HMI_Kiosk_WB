<div style="width:1024px; height:600px; background:#111827; display:flex; flex-direction:column;" onclick="fetch('/api/uart_send?msg=[Action] Touch')">
    <!-- Header -->
    <div style="height:72px; background:#E79124; display:flex; align-items:center; justify-content:space-between; padding:0 32px; flex-shrink:0;">
        <span style="font-size:1.7rem; font-weight:bold; color:white; letter-spacing:2px;">QR Payment</span>
        <div style="color:white; font-size:1.3rem; font-weight:bold; background:rgba(0,0,0,0.2); padding:8px 16px; border-radius:8px;">
            ยอดเงินคงเหลือ: <span class="global-balance-display">0</span> THB
        </div>
    </div>

    <!-- Content Split -->
    <div style="flex:1; display:flex;">
        <!-- Left: Control -->
        <div style="width:400px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:30px; border-right:1px solid rgba(255,255,255,0.1); padding:40px;">
            <p style="color:#9CA3AF; font-size:1.2rem; font-weight:bold; letter-spacing:2px; text-transform:uppercase;">จำนวนเงิน</p>
            
            <div style="display:flex; align-items:center; gap:20px;">
                <button onclick="adj( -10 )" style="width:80px; height:80px; background:#1F2937; color:white; border:2px solid #374151; border-radius:16px; font-size:3rem; cursor:pointer;">-</button>
                <div style="width:180px; height:100px; background:#111827; border:2px solid #374151; border-radius:16px; display:flex; align-items:center; justify-content:center; gap:10px;">
                    <span id="qr-amount" style="font-size:3.5rem; font-weight:bold; color:white;">10</span>
                    <span style="font-size:1.2rem; color:#9CA3AF; font-weight:bold; margin-top:15px;">THB</span>
                </div>
                <button onclick="adj( 10 )" style="width:80px; height:80px; background:#1F2937; color:white; border:2px solid #374151; border-radius:16px; font-size:3rem; cursor:pointer;">+</button>
            </div>

            <p style="color:#3B82F6; font-size:1.1rem; font-weight:bold; cursor:pointer; text-decoration:underline; margin-bottom:10px;">Scan the QR to pay</p>

            <div style="width:100%; display:flex; flex-direction:column; gap:15px;">
                <button id="btn-qr-ok" onclick="requestQR()" style="width:100%; height:80px; background:#1E3A8A; color:white; font-size:1.8rem; font-weight:bold; border-radius:16px; border:none; cursor:pointer; text-transform:uppercase;">OK</button>
                <button onclick="navTo('/page/payment', '[State] Payment')" style="width:100%; height:60px; background:transparent; color:#9CA3AF; border:1px solid #374151; border-radius:16px; font-size:1.4rem; cursor:pointer;">Back</button>
            </div>
        </div>

        <!-- Right: Display -->
        <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; position:relative;">
            <div id="qr-container" style="width:400px; height:400px; background:white; border-radius:24px; padding:20px; display:flex; align-items:center; justify-content:center; box-shadow:0 0 40px rgba(255,255,255,0.1);">
                <div id="qr-placeholder" style="text-align:center; color:#111827;">
                    <p style="font-weight:bold; font-size:1.2rem;">พร้อมชำระเงิน</p>
                    <p style="font-size:0.9rem; color:#6B7280;">กดปุ่ม OK เพื่อรับ QR Code</p>
                </div>
                <img id="qr-img" src="" style="display:none; width:100%; height:100%; object-fit:contain;">
            </div>
            <p id="qr-status-label" style="font-size:1.5rem; font-weight:bold; color:white; letter-spacing:2px;">10 THB</p>
            
            <!-- Overlay for Success/Error - Fixed to only show for new events -->
            <div id="qr-overlay" style="display:none; position:absolute; inset:0; background:rgba(17,24,39,0.95); z-index:1000; flex-direction:column; align-items:center; justify-content:center; gap:20px; border-radius:0;">
                <h2 id="overlay-title" style="font-size:5rem; font-weight:bold; margin:0;">SUCCESS</h2>
                <p id="overlay-msg" style="font-size:1.8rem; color:#9CA3AF;">กำลังเริ่มงาน...</p>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        let amount = 10;
        let isWaiting = false;
        let lastSeenActionSeq = 0;
        let lastSeenQrSeq = 0;

        // Auto send [QR] wait on load
        fetch('/api/uart_send?msg=' + encodeURIComponent('[QR] wait'));

        // Initialize sequences on load to ignore past events
        fetch('/api/action_state').then(r=>r.json()).then(d => {
            if(d.action_event) lastSeenActionSeq = d.action_event.seq;
            if(d.qr_event) lastSeenQrSeq = d.qr_event.seq;
        }).catch(()=>{});

        window.adj = (v) => {
            if (isWaiting) return;
            amount += v;
            if (amount < 10) amount = 10;
            document.getElementById('qr-amount').innerText = amount;
            document.getElementById('qr-status-label').innerText = amount + ' THB';
        };

        window.requestQR = () => {
            if (isWaiting) return;
            isWaiting = true;
            document.getElementById('btn-qr-ok').style.opacity = '0.5';
            document.getElementById('qr-placeholder').innerHTML = '<p style="font-weight:bold;">กำลังสร้าง QR...</p>';
            fetch('/api/uart_send?msg=' + encodeURIComponent('[QR] ' + amount));
        };

        const poll = setInterval(async () => {
            try {
                const res = await fetch('/api/action_state');
                const d = await res.json();
                
                // 1. Handle QR Events (from qr_event lane)
                const qe = d.qr_event;
                if (qe && qe.seq > lastSeenQrSeq) {
                    lastSeenQrSeq = qe.seq;
                    if (qe.name === 'QR_PAYLOAD' || qe.name === 'QR_URL') {
                        const img = document.getElementById('qr-img');
                        const ph = document.getElementById('qr-placeholder');
                        ph.style.display = 'none';
                        img.style.display = 'block';
                        img.src = (qe.name === 'QR_URL') ? qe.val : 'https://api.qrserver.com/v1/create-qr-code/?size=350x350&data=' + encodeURIComponent(qe.val);
                    } else if (qe.name === 'WAITING_QR') {
                        document.getElementById('qr-placeholder').innerHTML = '<p style="font-weight:bold;">กำลังรอ QR จาก Server...</p>';
                    }
                }

                // 2. Handle Payment Status (from action_event lane)
                const ae = d.action_event;
                if (ae && ae.seq > lastSeenActionSeq) {
                    lastSeenActionSeq = ae.seq;
                    if (ae.name === 'PAYMENT_OK') {
                        showOverlay('SUCCESS', '#10B981', 'ชำระเงินสำเร็จ กรุณากดปุ่มเพื่อเริ่มงาน');
                        const ov = document.getElementById('qr-overlay');
                        if (!document.getElementById('btn-start-work')) {
                            const startBtn = document.createElement('button');
                            startBtn.id = 'btn-start-work';
                            startBtn.innerText = 'START';
                            startBtn.style = 'margin-top:20px; width:250px; height:80px; background:#10B981; color:white; font-size:2rem; font-weight:bold; border-radius:16px; border:none; cursor:pointer; box-shadow:0 10px 20px rgba(16,185,129,0.3);';
                            startBtn.onclick = async () => {
                                fetch('/api/uart_send?msg=' + encodeURIComponent('[Action] Start'));
                                const confRes = await fetch('/api/settings');
                                const conf = await confRes.json();
                                navTo('/page/operation_' + (conf.machine_system || 'CATCARWASH'), '[State] operation');
                            };
                            ov.appendChild(startBtn);
                        }
                        clearInterval(poll);
                    } else if (ae.name === 'PAYMENT_ERROR') {
                        showOverlay('FAILED', '#EF4444', ae.val || 'ชำระเงินผิดพลาด');
                        setTimeout(hideOverlay, 3000);
                    } else if (ae.name === 'PAYMENT_TIMEOUT') {
                        showOverlay('TIMEOUT', '#F59E0B', 'QR หมดอายุ กรุณาลองใหม่');
                        setTimeout(hideOverlay, 3000);
                    }
                }
            } catch(e){}
        }, 1000);

        function showOverlay(title, color, msg) {
            const ov = document.getElementById('qr-overlay');
            ov.style.display = 'flex';
            document.getElementById('overlay-title').innerText = title;
            document.getElementById('overlay-title').style.color = color;
            document.getElementById('overlay-msg').innerText = msg;
        }

        function hideOverlay() {
            document.getElementById('qr-overlay').style.display = 'none';
            isWaiting = false;
            document.getElementById('btn-qr-ok').style.opacity = '1';
        }

        document.addEventListener('htmx:beforeSwap', () => clearInterval(poll), {once:true});
    })();

    function navTo(url, uartMsg) {
        if(uartMsg) fetch('/api/uart_send?msg=' + encodeURIComponent(uartMsg));
        htmx.ajax('GET', url, {target: '#content'});
    }
</script>
