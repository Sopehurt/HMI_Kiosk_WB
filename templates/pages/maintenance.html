<!DOCTYPE html>
<style>
    :root {
        --primary: #3b82f6;
        --secondary: #e79124;
        --bg-side: #111827;
        --bg-content: #0f172a;
        --bg-input: #1e293b;
        --text: #ffffff;
        --text-muted: #94a3b8;
        --success: #10b981;
        --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-user-select: none; font-family: 'Inter', sans-serif; }
    
    .m-root { width: 1024px; height: 600px; display: flex; flex-direction: column; background: var(--bg-content); color: var(--text); overflow: hidden; }
    
    .m-header { height: 60px; background: var(--secondary); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
    .m-title { font-size: 26px; font-weight: 900; letter-spacing: 1px; }
    .btn-exit { background: rgba(0,0,0,0.3); border: none; color: white; padding: 10px 30px; border-radius: 8px; font-weight: 800; font-size: 18px; cursor: pointer; }

    .m-body { flex: 1; display: flex; overflow: hidden; }

    .m-sidebar { width: 220px; background: var(--bg-side); border-right: 1px solid #2d3748; display: flex; flex-direction: column; }
    .menu-item { padding: 22px 25px; font-size: 20px; font-weight: 800; color: var(--text-muted); cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .menu-item.active { background: var(--primary); color: white; }

    .m-main { flex: 1; padding: 25px; overflow-y: auto; display: flex; flex-direction: column; }
    .section-title { font-size: 24px; font-weight: 800; margin-bottom: 25px; color: var(--text); }

    .f-card { background: var(--bg-side); border: 1px solid #2d3748; padding: 25px; border-radius: 8px; }
    .f-table { width: 100%; border-collapse: collapse; }
    .f-table th { text-align: left; padding: 12px; font-size: 14px; color: var(--text-muted); background: rgba(255,255,255,0.03); }
    .f-table td { padding: 15px 12px; border-bottom: 1px solid #2d3748; font-size: 18px; font-weight: 700; }

    .f-input { width: 100%; background: var(--bg-input); border: 1px solid #334155; color: white; padding: 12px; border-radius: 6px; font-size: 22px; font-weight: 800; text-align: center; }
    .f-btn { background: var(--primary); color: white; border: none; padding: 15px 35px; border-radius: 8px; font-weight: 900; font-size: 18px; cursor: pointer; }
    .f-btn-sm { padding: 8px 20px; font-size: 16px; }
    .f-btn-success { background: var(--success); }
    .f-btn-danger { background: var(--danger); }

    ::-webkit-scrollbar { width: 0px; background: transparent; }

    .f-tabs { display: flex; background: var(--bg-side); padding: 5px; border-radius: 10px; gap: 5px; margin-bottom: 20px; width: fit-content; border: 1px solid #2d3748; }
    .f-tab { padding: 10px 20px; border: none; border-radius: 6px; font-size: 15px; font-weight: 800; color: var(--text-muted); background: transparent; cursor: pointer; }
    .f-tab.active { background: var(--secondary); color: white; }

    .overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:1000; display:none; justify-content:center; align-items:center; }
    input[type="checkbox"].f-check { width: 40px; height: 40px; cursor: pointer; accent-color: var(--primary); }
</style>

<div class="m-root" onclick="sendUart('[Action] Touch')">
    <div class="m-header">
        <div class="m-title">MAINTENANCE</div>
        <button class="btn-exit" onclick="htmx.ajax('GET', '/page/home', {target: '#content'})">EXIT</button>
    </div>

    <div class="m-body">
        <div class="m-sidebar">
            <div id="m-merchant" class="menu-item active" onclick="showPage('merchant')">Merchant</div>
            <div id="m-testing" class="menu-item" onclick="showPage('testing')">Testing</div>
            <div id="m-price" class="menu-item" onclick="showPage('price')">Start Price</div>
            <div id="m-fn" class="menu-item" onclick="showPage('fn')">Function Config</div>
            <div id="m-wifi" class="menu-item" onclick="showPage('wifi')">WiFi Setup</div>
            <div id="m-about" class="menu-item" onclick="showPage('about')">About</div>
        </div>

        <div class="m-main">
            <div id="p-testing" class="page" style="display:none;">
                <div class="section-title" style="display:flex; justify-content:space-between; align-items:center;">Testing <button class="f-btn f-btn-sm f-btn-success" onclick="maintSubmit()">SUBMIT</button></div>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:25px;">
                    <div class="f-card" onclick="sendUart('[Mode] TestCoin')" style="cursor:pointer;"><div style="color:var(--text-muted); font-size:16px; font-weight:700;">COIN (Press to Test)</div><div id="val-coin" style="font-size:64px; font-weight:900;">0</div></div>
                    <div class="f-card" onclick="sendUart('[Mode] TestBank')" style="cursor:pointer;"><div style="color:var(--text-muted); font-size:16px; font-weight:700;">BANK (Press to Test)</div><div id="val-bank" style="font-size:64px; font-weight:900;">0</div></div>
                </div>
            </div>

            <div id="p-price" class="page" style="display:none;">
                <div class="section-title">Start Price (THB)</div>
                <div class="f-card" style="display:flex; align-items:center; justify-content:center; gap:40px; padding:50px;">
                    <button class="f-btn f-btn-danger" style="width:100px; height:80px; font-size:32px;" onclick="adjPrice(-5)">-5</button>
                    <div id="price-val" style="font-size:96px; font-weight:900; color:var(--secondary);">20</div>
                    <button class="f-btn f-btn-success" style="width:100px; height:80px; font-size:32px;" onclick="adjPrice(5)">+5</button>
                </div>
                <button class="f-btn f-btn-success" style="margin-top:30px; width:100%; height:70px; font-size:24px;" onclick="savePrice()">SAVE PRICE</button>
            </div>

            <div id="p-fn" class="page" style="display:none;">
                <div class="section-title">Function Config</div>
                <div id="fn-tabs" class="f-tabs">
                    <button class="f-tab active" onclick="setMode('CATCARWASH')">CATCARWASH</button>
                    <button class="f-tab" onclick="setMode('CATPAW-SHOE')">CATPAW-SHOE</button>
                    <button class="f-tab" onclick="setMode('CATPAW-HELMET')">CATPAW-HELMET</button>
                </div>
                <div id="fn-container" style="max-height:280px; overflow-y:auto; border:1px solid #2d3748; background:var(--bg-side);"></div>
                <button class="f-btn f-btn-success" style="margin-top:15px; width:100%; height:60px;" onclick="saveConfig()">SAVE CONFIG</button>
            </div>

            <div id="p-wifi" class="page" style="display:none;">
                <div class="section-title" style="display:flex; justify-content:space-between; align-items:center;">WiFi Setup <button id="btn-scan" class="f-btn f-btn-sm" onclick="scanWifi()">SCAN</button></div>
                <div class="f-card">
                    <div style="display:flex; gap:10px; margin-bottom:15px;">
                        <input type="text" id="w-ssid" class="f-input" placeholder="SSID" style="text-align:left; flex:1;" onclick="openKb(this)">
                        <div style="display:flex; flex:1; position:relative;">
                            <input type="password" id="w-pass" class="f-input" placeholder="PASSWORD" style="text-align:left; flex:1; padding-right:80px;" onclick="openKb(this)">
                            <button id="btn-show" onclick="togglePass()" style="position:absolute; right:5px; top:5px; bottom:5px; width:70px; background:#4a5568; border:none; color:white; border-radius:4px; font-weight:700; font-size:12px;">SHOW</button>
                        </div>
                    </div>
                    <div style="display:flex; justify-content:space-between; align-items:center; background:rgba(0,0,0,0.2); padding:15px; border-radius:8px;">
                        <div>
                            <div id="w-status-ssid" style="font-size:18px; font-weight:800; color:var(--primary);">Connected: --</div>
                            <div id="w-status-ip" style="font-size:14px; color:var(--text-muted);">IP: --</div>
                        </div>
                        <div style="display:flex; gap:10px;">
                            <button class="f-btn f-btn-danger f-btn-sm" onclick="forgetWifi()">FORGET</button>
                            <button class="f-btn f-btn-success f-btn-sm" onclick="connectWifi()">CONNECT</button>
                        </div>
                    </div>
                </div>
                <div id="w-list" style="margin-top:15px; max-height:200px; overflow-y:auto; border:1px solid #2d3748; background:var(--bg-side); border-radius:8px;"></div>
            </div>

            <div id="p-about" class="page" style="display:none;">
                <div class="section-title">Device Information</div>
                <div id="about-container"></div>
            </div>

            <div id="p-merchant" class="page">
                <div class="section-title">Merchant Channel Test</div>
                <div class="f-card" style="padding:30px;">
                    <div id="ch-grid" style="display:grid; grid-template-rows: 1fr 1fr; gap:30px;">
                        <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:20px;">
                            <button id="btn-ch7" class="f-btn" style="height:120px; font-size:32px; background:#374151;" onclick="toggleCH(7)">ฉีดน้ำ</button>
                            <button id="btn-ch6" class="f-btn" style="height:120px; font-size:32px; background:#374151;" onclick="toggleCH(6)">ฉีดโฟม</button>
                            <button id="btn-ch5" class="f-btn" style="height:120px; font-size:32px; background:#374151;" onclick="toggleCH(5)">เป่าลม</button>
                            <button id="btn-ch4" class="f-btn" style="height:120px; font-size:32px; background:#374151;" onclick="toggleCH(4)">น้ำประปา</button>
                        </div>
                        <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:20px;">
                            <button id="btn-ch3" class="f-btn" style="height:120px; font-size:32px; background:#374151;" onclick="toggleCH(3)">ดูดฝุ่น</button>
                            <button id="btn-ch2" class="f-btn" style="height:120px; font-size:32px; background:#374151;" onclick="toggleCH(2)">ยางดำ</button>
                            <button id="btn-ch1" class="f-btn" style="height:120px; font-size:32px; background:#374151;" onclick="toggleCH(1)">Wax</button>
                            <button id="btn-ch0" class="f-btn" style="height:120px; font-size:32px; background:#374151;" onclick="toggleCH(0)">น้ำหอม</button>
                        </div>
                    </div>
                    <div id="ch-status" style="margin-top:20px; text-align:center; color:var(--text-muted); font-size:20px; font-weight:800;">All Channels Ready</div>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="m-kb" class="overlay">
    <div style="background:var(--bg-side); border:1px solid #2d3748; padding:20px; width:980px; border-radius:12px;">
        <div style="display:flex; gap:10px; margin-bottom:15px;">
            <input type="text" id="m-kb-val" style="flex:1; height:60px; background:black; border:1px solid #334155; color:white; font-size:28px; padding:0 20px; border-radius:8px;">
            <button class="f-btn f-btn-danger" style="width:100px;" onclick="pressKb('BS')">DEL</button>
        </div>
        <div id="kb-keys" style="display:grid; grid-template-columns: repeat(10, 1fr); gap:10px;"></div>
        <div style="display:flex; gap:10px; margin-top:10px;">
            <button id="kb-shift" class="f-btn" style="flex:1.5; background:#4a5568;" onclick="toggleShift()">SHIFT</button>
            <button class="f-btn" style="flex:5; background:#374151;" onclick="pressKb(' ')">SPACE</button>
            <button class="f-btn f-btn-danger" style="flex:1.5; background:#6b7280;" onclick="closeKb(false)">CANCEL</button>
            <button class="f-btn f-btn-success" style="flex:2;" onclick="closeKb(true)">DONE</button>
        </div>
    </div>
</div>

<div id="m-np" class="overlay">
    <div style="background:#1f2937; border:1px solid #374151; padding:25px; width:400px; border-radius:24px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);">
        <div id="np-title" style="margin-bottom:15px; color:var(--text-muted); font-weight:900; text-align:center; font-size:18px; letter-spacing:2px;">ENTER CODE</div>
        <input type="password" id="m-np-val" readonly style="width:100%; height:70px; background:#0f172a; border:none; color:white; font-size:42px; text-align:center; margin-bottom:20px; border-radius:12px; letter-spacing:10px;">
        <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:12px;">
            <button class="f-btn" style="height:70px; font-size:28px; background:#374151;" onclick="pressNp('1')">1</button>
            <button class="f-btn" style="height:70px; font-size:28px; background:#374151;" onclick="pressNp('2')">2</button>
            <button class="f-btn" style="height:70px; font-size:28px; background:#374151;" onclick="pressNp('3')">3</button>
            <button class="f-btn" style="height:70px; font-size:28px; background:#374151;" onclick="pressNp('4')">4</button>
            <button class="f-btn" style="height:70px; font-size:28px; background:#374151;" onclick="pressNp('5')">5</button>
            <button class="f-btn" style="height:70px; font-size:28px; background:#374151;" onclick="pressNp('6')">6</button>
            <button class="f-btn" style="height:70px; font-size:28px; background:#374151;" onclick="pressNp('7')">7</button>
            <button class="f-btn" style="height:70px; font-size:28px; background:#374151;" onclick="pressNp('8')">8</button>
            <button class="f-btn" style="height:70px; font-size:28px; background:#374151;" onclick="pressNp('9')">9</button>
            <button class="f-btn f-btn-danger" style="height:70px; font-size:32px;" onclick="pressNp('CLR')">C</button>
            <button class="f-btn" style="height:70px; font-size:28px; background:#374151;" onclick="pressNp('0')">0</button>
            <button class="f-btn f-btn-success" style="height:70px; font-size:28px; background:var(--success);" onclick="closeNp(true)">OK</button>
        </div>
        <button class="f-btn" style="width:100%; margin-top:15px; background:#4b5563; height:50px; font-size:16px; border-radius:10px;" onclick="closeNp(false)">CANCEL</button>
    </div>
</div>

<script>
(function() {
    let config = {};
    let currentMode = 'CATCARWASH';
    let npTarget = null;
    let kbTarget = null;
    let isShift = false;
    let pendingPage = null;
    let activeCH = null;

    const keyRows = [
        ['1','2','3','4','5','6','7','8','9','0'],
        ['q','w','e','r','t','y','u','i','o','p'],
        ['a','s','d','f','g','h','j','k','l','@'],
        ['z','x','c','v','b','n','m','-','_','.']
    ];

    function renderKb() {
        const box = document.getElementById('kb-keys');
        let html = '';
        keyRows.forEach(row => {
            row.forEach(k => {
                const display = isShift ? k.toUpperCase() : k;
                html += `<button class="f-btn" style="padding:15px 0; font-size:22px; background:#374151;" onclick="pressKb('${display}')">${display}</button>`;
            });
        });
        box.innerHTML = html;
        document.getElementById('kb-shift').style.background = isShift ? 'var(--primary)' : '#4a5568';
    }

    window.toggleShift = () => { isShift = !isShift; renderKb(); };
    window.togglePass = () => {
        const inp = document.getElementById('w-pass');
        const btn = document.getElementById('btn-show');
        if(inp.type === 'password') { inp.type = 'text'; btn.innerText = 'HIDE'; }
        else { inp.type = 'password'; btn.innerText = 'SHOW'; }
    };
    window.openKb = (el) => { kbTarget = el; document.getElementById('m-kb').style.display='flex'; document.getElementById('m-kb-val').value=el.value; renderKb(); };
    window.pressKb = (k) => { let d=document.getElementById('m-kb-val'); if(k==='BS') d.value=d.value.slice(0,-1); else d.value+=k; };
    window.closeKb = (s) => { if(s && kbTarget) kbTarget.value=document.getElementById('m-kb-val').value; document.getElementById('m-kb').style.display='none'; kbTarget=null; };

    window.toggleCH = function(ch) {
        if (activeCH !== null && activeCH !== ch) return;
        const btn = document.getElementById('btn-ch' + ch);
        if (activeCH === ch) {
            btn.style.background = '#374151'; activeCH = null;
            document.querySelectorAll('#ch-grid button').forEach(b => { b.style.opacity='1'; b.style.cursor='pointer'; });
            document.getElementById('ch-status').innerText = 'All Channels Ready';
            sendUart(`[Merchant] fn${ch} Off`);
        } else {
            activeCH = ch; btn.style.background = 'var(--secondary)';
            document.querySelectorAll('#ch-grid button').forEach(b => { if(b.id !== 'btn-ch'+ch){ b.style.opacity='0.3'; b.style.cursor='not-allowed'; } });
            document.getElementById('ch-status').innerText = `CH${ch} is ACTIVE`;
            sendUart(`[Merchant] fn${ch} On`);
        }
    };

    window.showPage = (id) => { 
        if (id === 'merchant') {
            forceShowPage(id);
        } else {
            pendingPage = id;
            openNp(null, "Admin Passcode");
        }
    };
    
    function forceShowPage(id) {
        document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
        document.getElementById('p-' + id).style.display = 'block';
        document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
        document.getElementById('m-' + id).classList.add('active');
        if(id === 'fn') renderFn(); if(id === 'about') renderAbout(); if(id === 'wifi') updateWifiStatus();
    }

    window.adjPrice = (v) => { let el=document.getElementById('price-val'); let p=parseInt(el.innerText)+v; el.innerText=p<0?0:p; };
    window.savePrice = async () => {
        const p = parseInt(document.getElementById('price-val').innerText);
        const res = await fetch('/api/settings', {
            method:'POST', 
            headers: {'Content-Type': 'application/json'},
            body:JSON.stringify({startPrices:p})
        });
        const d = await res.json();
        if(d.ok) { 
            sendUart(`[Config] Preference|{"startPrices":${p}}`);
            alert("Price Saved!"); 
        }
    };
    window.sendUart = (m) => fetch(`/api/uart_send?msg=${encodeURIComponent(m)}`);
    window.maintSubmit = () => {
        sendUart('[Maint] Submit');
        document.getElementById('val-coin').innerText = '0';
        document.getElementById('val-bank').innerText = '0';
    };

    window.openNp = (el, t) => { 
        npTarget=el; 
        const vInp = document.getElementById('m-np-val');
        vInp.type = (pendingPage && pendingPage !== 'merchant') ? 'password' : 'text';
        document.getElementById('np-title').innerText=t||"Value"; 
        document.getElementById('m-np').style.display='flex'; 
        vInp.value=el?el.value:""; 
    };
    window.pressNp = (v) => { 
        let d=document.getElementById('m-np-val'); 
        if(v==='CLR') d.value=''; 
        else if(v==='DEL') d.value = d.value.slice(0, -1);
        else d.value+=v; 

        if(pendingPage && pendingPage !== 'merchant' && d.value==='88888'){
            forceShowPage(pendingPage);
            pendingPage=null;
            document.getElementById('m-np').style.display='none';
        }
    };
    window.closeNp = (s) => {
        const val = document.getElementById('m-np-val').value;
        if(s) {
            if(pendingPage && pendingPage !== 'merchant'){ 
                if(val==='88888') forceShowPage(pendingPage); 
                else alert("Access Denied!"); 
                pendingPage=null; 
            }
            else if(npTarget) npTarget.value=val;
        } else pendingPage=null;
        document.getElementById('m-np').style.display='none';
    };

    window.updateWifiStatus = async () => { 
        try { 
            const res=await fetch('/api/wifi/status'); 
            const d=await res.json(); 
            document.getElementById('w-status-ssid').innerText=d.ssid?`Connected: ${d.ssid}`:'--'; 
            document.getElementById('w-status-ip').innerText=d.ip?`IP: ${d.ip}`:'--'; 
            
            // Fill from config/preference
            if(config.ssid) document.getElementById('w-ssid').value = config.ssid;
            if(config.wfpwd) document.getElementById('w-pass').value = config.wfpwd;
        } catch(e){} 
    };

    window.scanWifi = async () => {
        const btn = document.getElementById('btn-scan');
        btn.innerText = 'SCANNING...'; btn.disabled = true;
        try {
            const res = await fetch('/api/wifi/scan');
            const nets = await res.json();
            let html = '';
            nets.forEach(n => {
                html += `<div style="display:flex; justify-content:space-between; padding:15px; border-bottom:1px solid #2d3748; cursor:pointer;" onclick="selectWifi('${n.ssid}')">
                    <span style="font-weight:700;">${n.ssid}</span>
                    <span style="color:var(--primary); font-weight:900;">${n.signal}%</span>
                </div>`;
            });
            document.getElementById('w-list').innerHTML = html || '<div style="padding:15px; text-align:center;">No Networks Found</div>';
        } catch(e) {}
        btn.innerText = 'SCAN'; btn.disabled = false;
    };
    window.selectWifi = (ssid) => { document.getElementById('w-ssid').value = ssid; };

    window.connectWifi = async () => {
        const ssid = document.getElementById('w-ssid').value;
        const pw = document.getElementById('w-pass').value;
        if(!ssid) return alert("Select SSID");
        
        // 1. Update Preference first
        await fetch('/api/settings', {
            method:'POST', 
            headers: {'Content-Type': 'application/json'},
            body:JSON.stringify({ssid:ssid, wfpwd:pw})
        });
        
        // 2. Send to ESP32 with the new format
        sendUart(`[Config] Preference|{"ssid":"${ssid}", "wfpwd":"${pw}"}`);
        
        // 3. Trigger actual connection
        const res = await fetch('/api/wifi/connect', {
            method:'POST', 
            headers: {'Content-Type': 'application/json'},
            body:JSON.stringify({ssid:ssid, password:pw})
        });
        const d = await res.json();
        if(d.ok) { alert("Connect Command Sent"); updateWifiStatus(); }
        else alert("Failed: " + (d.msg || "Unknown error"));
    };

    window.forgetWifi = async () => {
        const ssid = document.getElementById('w-ssid').value;
        if(!ssid) return alert("Enter/Select SSID to Forget");
        if(!confirm(`Delete WiFi "${ssid}"?`)) return;
        const res = await fetch('/api/wifi/forget', {method:'POST', body:JSON.stringify({ssid:ssid})});
        const d = await res.json();
        if(d.ok) { alert("WiFi Deleted"); updateWifiStatus(); }
    };

    window.setMode = (m) => { currentMode=m; document.querySelectorAll('.f-tab').forEach(t=>t.classList.toggle('active', t.innerText===m)); renderFn(); };
    
    function renderFn() {
        const box = document.getElementById('fn-container');
        let html = '<table class="f-table">';
        if (currentMode === 'CATCARWASH') {
            html += '<tr><th>Name</th><th>Enable</th><th>Order</th><th>Time</th></tr>';
            const names = ["น้ำหอม", "Wax", "ยางดำ", "ดูดฝุ่น", "น้ำประปา", "เป่าลม", "ฉีดโฟม", "ฉีดน้ำ"];
            const en = config.fnEnable || config.fn_enable || [true,true,true,true,true,true,true,true];
            const t = config.fnTime || config.fn_time || [11,10,9,8,7,6,5,4];
            const o = config.fnOrder || config.fn_order || [0,1,2,3,4,5,6,7];
            
            // Display order requested by user: ฉีดน้ำ, ฉีดโฟม, เป่าลม, น้ำประปา, ดูดฝุ่น, ยางดำ, Wax, น้ำหอม
            const displayOrder = [7, 6, 5, 4, 3, 2, 1, 0];
            
            displayOrder.forEach(idx => { 
                let n = names[idx];
                html += `<tr data-idx="${idx}"><td>${n}</td><td><input type="checkbox" class="f-check" ${en[idx]?'checked':''}></td><td><input class="f-input" value="${o[idx]}" style="width:50px;height:35px;" onclick="openNp(this)"></td><td><input class="f-input" value="${t[idx]}" style="width:70px;height:35px;" onclick="openNp(this)"></td></tr>`; 
            });
        } else {
            html += '<tr><th>NAME</th><th style="text-align:center;">Start_Time</th><th style="text-align:center;">End_Time</th></tr>';
            const cp = config.catpaw_config || {};
            const pName = currentMode === 'CATPAW-HELMET' ? 'อบหมวกด้วยน้ำหอม' : 'อบรองเท้าด้วยน้ำหอม';
            const items = [
                {id:'t_total', n:'TOTAL TIME', s:null, e:cp.t_total || 420},
                {id:'uv', n:'อบด้วยยูวีและโอโซน', s:cp.uv_s || 0, e:cp.uv_e || 420},
                {id:'dust', n:'เป่าฝุ่นด้วยแรงดันลม', s:cp.dust_s || 0, e:cp.dust_e || 60},
                {id:'bact', n:'ฆ่าเชื้อแบคทีเรีย', s:cp.bact_s || 0, e:cp.bact_e || 180},
                {id:'dry', n:'อบแห้งด้วยลมร้อน', s:cp.dry_s || 0, e:cp.dry_e || 300},
                {id:'perfume', n:pName, s:cp.perfume_s || 0, e:cp.perfume_e || 420}
            ];
            items.forEach(it => { 
                html += `<tr data-id="${it.id}"><td>${it.n}</td>
                    <td style="text-align:center;">${it.s!==null?`<input class="f-input f-s" value="${it.s}" style="width:70px;height:35px;" onclick="openNp(this)">`:''}</td>
                    <td style="text-align:center;"><input class="f-input f-e" value="${it.e}" style="width:70px;height:35px;" onclick="openNp(this)"></td></tr>`; 
            });
        }
        box.innerHTML = html + '</table>';
    }

    window.saveConfig = async () => {
        let payload = { machine_system: currentMode };
        if(currentMode === 'CATCARWASH') {
            let en = new Array(8), t = new Array(8), o = new Array(8);
            document.querySelectorAll('#fn-container tr[data-idx]').forEach(tr => {
                let idx = parseInt(tr.getAttribute('data-idx'));
                en[idx] = tr.querySelector('.f-check').checked;
                o[idx] = parseInt(tr.querySelectorAll('.f-input')[0].value);
                t[idx] = parseInt(tr.querySelectorAll('.f-input')[1].value);
            });
            payload.fnEnable = en; payload.fnTime = t; payload.fnOrder = o;
        } else {
            let cp = {};
            document.querySelectorAll('#fn-container tr[data-id]').forEach(tr => {
                const id = tr.getAttribute('data-id');
                if(id==='t_total') cp.t_total = parseInt(tr.querySelector('.f-e').value);
                else {
                    cp[id+'_s'] = parseInt(tr.querySelector('.f-s').value);
                    cp[id+'_e'] = parseInt(tr.querySelector('.f-e').value);
                }
            });
            payload.catpaw_config = cp;
        }
        const res = await fetch('/api/settings', {
            method:'POST', 
            headers: {'Content-Type': 'application/json'},
            body:JSON.stringify(payload)
        });
        const d = await res.json();
        if(d.ok) { 
            sendUart(`[Config] Preference|${JSON.stringify(payload)}`);
            alert("Config Saved!"); 
        }
    };

    window.renderAbout = () => {
        const box = document.getElementById('about-container');
        const rows = [
            ["Device ID", config.deviceId || config.device_id || config.MAC],
            ["Firmware ver.", config.ver],
            ["machine system", config.machine_system || config.machineSystem],
            ["HMI Type", config.HMI],
            ["promotion", config.proMo || config.pro_mo],
            ["Last update", config.lastedUpdate],
            ["Last maintenance", config.lastedMaintenance]
        ];
        let html = '<table class="f-table">';
        rows.forEach(r => { html += `<tr><td style="color:var(--text-muted);width:45%;">${r[0]}</td><td style="font-weight:800; text-align:right;">${r[1]||'--'}</td></tr>`; });
        box.innerHTML = html + '</table>';
    };

    let lastSeenStateSeq = 0;
    fetch('/api/action_state').then(r=>r.json()).then(d => {
        if(d.state_event) lastSeenStateSeq = d.state_event.seq;
    }).catch(()=>{});

    const poll = setInterval(async () => { 
        try { 
            const res = await fetch('/api/action_state'); 
            const d = await res.json(); 
            
            if (document.getElementById('p-testing').style.display !== 'none') {
                document.getElementById('val-coin').innerText = d.test_coin || 0;
                document.getElementById('val-bank').innerText = d.test_bank || 0;
            }
            
            // Force Home ONLY if it is a NEW state event
            if (d.state_event && d.state_event.seq > lastSeenStateSeq) {
                lastSeenStateSeq = d.state_event.seq;
                if (d.state_event.name === 'Home') {
                    htmx.ajax('GET', '/page/home', {target: '#content'});
                }
            }
        } catch(e){} 
    }, 1000);
    async function init() {
        try { 
            const res=await fetch('/api/settings'); 
            config = await res.json(); 
            document.getElementById('price-val').innerText = config.startPrices || config.start_prices || 20; 
        } catch(e){}
    }
    init();
})();
</script>
