<div id="home-root" 
    hx-get="/page/payment" hx-target="#content"
    style="width:1024px; height:600px; background:#111827; display:flex; flex-direction:column; justify-content:center; align-items:center; position:relative; overflow:hidden; cursor:pointer;">
    
    <!-- Branding Section -->
    <div style="text-align:center;">
        <h1 style="font-size:100px; font-weight:700; color:#ffffff; margin:0; letter-spacing:-1px; font-family:'Inter', -apple-system, sans-serif;">Moderncha</h1>
        <p style="font-size:22px; color:#64748b; margin-top:20px; letter-spacing:1px; font-weight:400;">Tap to start</p>
    </div>

    <!-- Status Indicator (Bottom Right) -->
    <div id="mqtt-status-container" style="position:absolute; bottom:25px; right:25px; display:flex; align-items:center; background:#020617; border:1px solid rgba(255,255,255,0.1); border-radius:100px; padding:6px 16px; gap:8px;">
        <div id="mqtt-dot" style="width:10px; height:10px; background:#4b5563; border-radius:50%; transition: 0.3s;"></div>
        <span id="mqtt-text" style="color:#4b5563; font-size:12px; font-weight:700; letter-spacing:1px; font-family:sans-serif; text-transform:uppercase;">Offline</span>
    </div>

    <!-- Hidden Admin Panel Access (Top Right) -->
    <div style="position:absolute; top:0; right:0; width:100px; height:100px; z-index:100;" 
         onclick="event.stopPropagation(); adminTap()">
    </div>

    <!-- Idle Video Player (Full Screen Overlay) -->
    <div id="video-overlay" style="position:absolute; inset:0; background:black; z-index:500; display:none; justify-content:center; align-items:center;">
        <video id="idle-player" style="width:100%; height:100%; object-fit:contain;" playsinline muted></video>
    </div>
</div>

<!-- Admin Numpad Overlay -->
<div id="admin-numpad" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:1000; display:none; justify-content:center; align-items:center;">
    <div style="background:#1f2937; border:1px solid #374151; border-radius:24px; padding:25px; width:400px; box-shadow: 0 20px 50px rgba(0,0,0,0.5);">
        <div style="text-align:center; margin-bottom:15px;">
            <h3 style="color:#94a3b8; font-size:18px; font-weight:900; letter-spacing:2px; margin-bottom:12px;">ENTER ADMIN CODE</h3>
            <div id="admin-display" style="height:70px; background:#0f172a; border-radius:12px; display:flex; justify-content:center; align-items:center; font-size:42px; letter-spacing:10px; color:white; font-weight:700;"></div>
        </div>
        
        <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:12px;">
            <!-- Numpad Buttons -->
            <button class="num-btn" onclick="pressAdmin('1')">1</button>
            <button class="num-btn" onclick="pressAdmin('2')">2</button>
            <button class="num-btn" onclick="pressAdmin('3')">3</button>
            <button class="num-btn" onclick="pressAdmin('4')">4</button>
            <button class="num-btn" onclick="pressAdmin('5')">5</button>
            <button class="num-btn" onclick="pressAdmin('6')">6</button>
            <button class="num-btn" onclick="pressAdmin('7')">7</button>
            <button class="num-btn" onclick="pressAdmin('8')">8</button>
            <button class="num-btn" onclick="pressAdmin('9')">9</button>
            <button class="num-btn" style="background:#ef4444; font-size:32px;" onclick="pressAdmin('CLR')">C</button>
            <button class="num-btn" onclick="pressAdmin('0')">0</button>
            <button class="num-btn" style="background:#10b981; font-size:28px;" onclick="closeAdmin(true)">OK</button>
        </div>
        <button class="num-btn" style="width:100%; margin-top:15px; background:#4b5563; height:50px; font-size:16px; border-radius:10px;" onclick="closeAdmin(false)">CANCEL</button>
    </div>
</div>

<style>
    .num-btn {
        height: 70px; border-radius: 12px; border: none; background: #374151; color: white;
        font-size: 28px; font-weight: 700; cursor: pointer;
    }
    .num-btn:active { background: #4b5563; }
</style>

<script>
(function() {
    let tapCount = 0;
    let tapTimer = null;
    let adminCode = "";
    
    // Idle Video Variables
    let idleTime = 30; // Default
    let idleCounter = 0;
    let isPlayingVideo = false;
    let videoList = [];

    // Fetch settings to get delay_time[6]
    fetch('/api/settings').then(r=>r.json()).then(d => {
        if(d.delay_time && d.delay_time[6]) {
            idleTime = parseInt(d.delay_time[6]);
        }
    }).catch(()=>{});

    // Global reset on interaction
    document.getElementById('home-root').addEventListener('mousedown', () => {
        resetIdle();
        if (isPlayingVideo) stopVideo();
    });

    function resetIdle() {
        idleCounter = 0;
    }

    async function startVideo() {
        if (isPlayingVideo) return;
        try {
            const res = await fetch('/api/videos');
            const data = await res.json();
            videoList = data.videos || [];
            if (videoList.length === 0) return;
            
            isPlayingVideo = true;
            const ov = document.getElementById('video-overlay');
            const player = document.getElementById('idle-player');
            ov.style.display = 'flex';
            
            playRandom();
            player.onended = () => {
                // Clear cache before next
                player.pause();
                player.src = "";
                player.load();
                playRandom();
            };
        } catch(e) { isPlayingVideo = false; }
    }

    function playRandom() {
        if (!isPlayingVideo) return;
        const player = document.getElementById('idle-player');
        const randomVid = videoList[Math.floor(Math.random() * videoList.length)];
        player.src = "/video/" + randomVid;
        player.play().catch(()=>{});
    }

    function stopVideo() {
        isPlayingVideo = false;
        const ov = document.getElementById('video-overlay');
        const player = document.getElementById('idle-player');
        ov.style.display = 'none';
        
        // RAM CLEANUP: Clear source and reload to free memory
        player.pause();
        player.removeAttribute('src');
        player.load();
        
        resetIdle();
    }

    window.adminTap = function() {
        resetIdle(); // Also reset on admin tap
        tapCount++;
        clearTimeout(tapTimer);
        if (tapCount >= 5) {
            tapCount = 0;
            document.getElementById('admin-numpad').style.display = 'flex';
        } else {
            tapTimer = setTimeout(() => { tapCount = 0; }, 2000);
        }
    };

    window.pressAdmin = function(v) {
        resetIdle();
        if (v === 'CLR') {
            adminCode = "";
        } else {
            if (adminCode.length < 5) adminCode += v;
        }
        
        // Update display with dots
        let display = "";
        for(let i=0; i<adminCode.length; i++) display += "●";
        document.getElementById('admin-display').innerText = display;

        if (adminCode === "00000") {
            adminCode = "";
            document.getElementById('admin-numpad').style.display = 'none';
            htmx.ajax('GET', '/page/maintenance', {target: '#content'});
        } else if (adminCode.length >= 5) {
            // Wrong code, flash red and reset
            document.getElementById('admin-display').style.color = "#ef4444";
            setTimeout(() => {
                adminCode = "";
                document.getElementById('admin-display').innerText = "";
                document.getElementById('admin-display').style.color = "white";
            }, 500);
        }
    };

    window.closeAdmin = function(isOk) {
        resetIdle();
        adminCode = "";
        document.getElementById('admin-display').innerText = "";
        document.getElementById('admin-numpad').style.display = 'none';
    };

    let lastSeenStateSeq = 0;
    fetch('/api/action_state').then(r=>r.json()).then(d => {
        if(d.state_event) lastSeenStateSeq = d.state_event.seq;
    }).catch(()=>{});

    const poll = setInterval(async () => {
        try {
            // 1. MQTT Status & State Event
            const res = await fetch('/api/action_state');
            const d = await res.json();
            
            // Check for Maintenance State Command
            if (d.state_event && d.state_event.seq > lastSeenStateSeq) {
                lastSeenStateSeq = d.state_event.seq;
                const stateName = d.state_event.name.toLowerCase();
                if (stateName === 'maintenance' || stateName === 'maint') {
                    if (isPlayingVideo) stopVideo();
                    htmx.ajax('GET', '/page/maintenance', {target: '#content'});
                }
            }
            
            const dot = document.getElementById('mqtt-dot');
            const txt = document.getElementById('mqtt-text');
            if (dot && txt) {
                if (d.mqtt_online) {
                    dot.style.background = '#10b981';
                    dot.style.boxShadow = '0 0 10px rgba(16,185,129,0.8)';
                    txt.style.color = '#10b981';
                    txt.innerText = 'Online';
                } else {
                    dot.style.background = '#4b5563';
                    dot.style.boxShadow = 'none';
                    txt.style.color = '#4b5563';
                    txt.innerText = 'Offline';
                }
            }

            // 2. Idle Timer Logic
            if (!isPlayingVideo && document.getElementById('admin-numpad').style.display === 'none') {
                idleCounter += 2; // Since poll is every 2s
                if (idleCounter >= idleTime) {
                    startVideo();
                }
            }
        } catch(e) {}
    }, 2000);

    document.addEventListener('htmx:beforeSwap', function cleanup() {
        if (isPlayingVideo) stopVideo();
        clearInterval(poll);
        document.removeEventListener('htmx:beforeSwap', cleanup);
    });
})();
</script>
