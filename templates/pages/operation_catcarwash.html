<div style="width:1024px; height:600px; background:#111827; display:flex; flex-direction:column; font-family: sans-serif; overflow:hidden;">
    <!-- Header: Solid colors, no shadows -->
    <div style="height:72px; background:#E79124; flex-shrink:0; display:flex; align-items:center; justify-content:space-between; padding:0 32px;">
        <span style="font-size:1.8rem; font-weight:bold; color:white;">CATCARWASH Operation</span>
        <div style="display:flex; gap:15px; align-items:center;">
            <div style="color:white; font-size:1.3rem; font-weight:bold; background:#111827; padding:8px 16px; border-radius:8px; border:1px solid #374151;">
                ยอดเงินคงเหลือ: <span class="global-balance-display">0</span> THB
            </div>
            <button onclick="topUp()" style="background:#3B82F6; color:white; border:none; border-radius:8px; padding:10px 24px; font-weight:bold; font-size:1.1rem; cursor:pointer;">TOP UP</button>
        </div>
    </div>

    <!-- Status: Minimalist -->
    <div style="padding:20px 32px 0 32px;">
        <div style="background:#1E2836; border:1px solid #374151; border-radius:12px; padding:12px; text-align:center;">
            <p style="color:#9CA3AF; font-size:0.9rem; font-weight:bold; margin-bottom:4px;">STATUS</p>
            <h2 id="status-display" style="color:#F59E0B; font-size:2.2rem; margin:0; text-transform:uppercase;">PLEASE SELECT A MODE</h2>
        </div>
    </div>

    <!-- Buttons Grid: Hardcoded as requested -->
    <div id="btn-grid" style="flex:1; padding:20px 32px; display:grid; grid-template-columns:repeat(4, 1fr); grid-template-rows:repeat(2, 1fr); gap:12px;">
        <button class="op-btn" id="btn-Spray" onclick="toggleFn('Spray', 'ฉีดน้ำ')" style="background:#1F2937; border:2px solid #374151; border-radius:12px; color:#D1D5DB; font-size:1.8rem; font-weight:bold; cursor:pointer;">ฉีดน้ำ</button>
        <button class="op-btn" id="btn-Foam" onclick="toggleFn('Foam', 'ฉีดโฟม')" style="background:#1F2937; border:2px solid #374151; border-radius:12px; color:#D1D5DB; font-size:1.8rem; font-weight:bold; cursor:pointer;">ฉีดโฟม</button>
        <button class="op-btn" id="btn-Air" onclick="toggleFn('Air', 'เป่าลม')" style="background:#1F2937; border:2px solid #374151; border-radius:12px; color:#D1D5DB; font-size:1.8rem; font-weight:bold; cursor:pointer;">เป่าลม</button>
        <button class="op-btn" id="btn-Water" onclick="toggleFn('Water', 'น้ำประปา')" style="background:#1F2937; border:2px solid #374151; border-radius:12px; color:#D1D5DB; font-size:1.8rem; font-weight:bold; cursor:pointer;">น้ำประปา</button>
        <button class="op-btn" id="btn-Vac" onclick="toggleFn('Vac', 'ดูดฝุ่น')" style="background:#1F2937; border:2px solid #374151; border-radius:12px; color:#D1D5DB; font-size:1.8rem; font-weight:bold; cursor:pointer;">ดูดฝุ่น</button>
        <button class="op-btn" id="btn-Tire" onclick="toggleFn('Tire', 'ยางดำ')" style="background:#1F2937; border:2px solid #374151; border-radius:12px; color:#D1D5DB; font-size:1.8rem; font-weight:bold; cursor:pointer;">ยางดำ</button>
        <button class="op-btn" id="btn-Wax" onclick="toggleFn('Wax', 'Wax')" style="background:#1F2937; border:2px solid #374151; border-radius:12px; color:#D1D5DB; font-size:1.8rem; font-weight:bold; cursor:pointer;">Wax</button>
        <button class="op-btn" id="btn-Frag" onclick="toggleFn('Frag', 'น้ำหอม')" style="background:#1F2937; border:2px solid #374151; border-radius:12px; color:#D1D5DB; font-size:1.8rem; font-weight:bold; cursor:pointer;">น้ำหอม</button>
    </div>

    <!-- Finish: Clean & Fast -->
    <div style="height:90px; display:flex; justify-content:center; align-items:center; padding-bottom:10px;">
        <button onclick="finishOp()" style="width:280px; height:60px; background:#EF4444; color:white; border:none; border-radius:12px; font-size:1.8rem; font-weight:bold; cursor:pointer;">FINISH</button>
    </div>
</div>

<style>
    /* Extreme Optimization: No transitions, no shadows */
    .op-btn.active {
        background:#3B82F6 !important;
        border-color:#60A5FA !important;
        color:white !important;
    }
    .op-btn.disabled {
        opacity: 0.2;
        pointer-events: none;
    }
    * { transition: none !important; animation: none !important; }
</style>

<script>
    (function() {
        let activeFn = null;

        window.toggleFn = (enName, thName) => {
            const btn = document.getElementById('btn-' + enName);
            if (activeFn === enName) {
                fetch('/api/uart_send?msg=[Action] Off ' + enName);
                deactivateUI();
            } else {
                if (activeFn !== null) fetch('/api/uart_send?msg=[Action] Off ' + activeFn);
                // Tiny delay to ensure previous off is sent
                setTimeout(() => {
                    fetch('/api/uart_send?msg=[Action] On ' + enName);
                }, 30);
                activateUI(enName, thName);
            }
        };

        function activateUI(enName, thName) {
            activeFn = enName;
            const btns = document.querySelectorAll('.op-btn');
            for(let b of btns) {
                b.classList.toggle('active', b.id === 'btn-' + enName);
                b.classList.toggle('disabled', b.id !== 'btn-' + enName);
            }
            const st = document.getElementById('status-display');
            st.innerText = thName + ' ACTIVE';
            st.style.color = '#3B82F6';
        }

        function deactivateUI() {
            activeFn = null;
            const btns = document.querySelectorAll('.op-btn');
            for(let b of btns) {
                b.classList.remove('active', 'disabled');
            }
            const st = document.getElementById('status-display');
            st.innerText = 'PLEASE SELECT A MODE';
            st.style.color = '#F59E0B';
        }

        window.finishOp = () => {
            fetch('/api/uart_send?msg=[State] Finish');
            setTimeout(() => {
                fetch('/api/uart_send?msg=[Action] Finish');
                navTo('/page/home');
            }, 50);
        };

        window.topUp = () => navTo('/page/qr?mode=topup', '[Action] Pause');

        let hasStarted = false;
        let lastSeenStateSeq = 0;
        
        // Initialize state sequence to ignore old [State] events
        fetch('/api/action_state').then(r=>r.json()).then(d => {
            if(d.state_event) lastSeenStateSeq = d.state_event.seq;
        }).catch(()=>{});

        // Poll for zero balance and State redirections
        const poll = setInterval(async () => {
            try {
                const res = await fetch('/api/action_state');
                const d = await res.json();
                
                // 1. Session Finish Logic: Only finish if we once had money and now it's 0
                if (d.balance > 0) hasStarted = true;
                if (hasStarted && d.balance <= 0) finishOp();
                
                // 2. State Redirection Logic: Force Home ONLY if it is a NEW state event
                if (d.state_event && d.state_event.seq > lastSeenStateSeq) {
                    lastSeenStateSeq = d.state_event.seq;
                    if (d.state_event.name === 'Home') {
                        navTo('/page/home');
                    }
                }
            } catch(e){}
        }, 1000);

        document.addEventListener('htmx:beforeSwap', () => clearInterval(poll), {once:true});
    })();

    function navTo(url, uartMsg) {
        if(uartMsg) fetch('/api/uart_send?msg=' + encodeURIComponent(uartMsg));
        htmx.ajax('GET', url, {target: '#content'});
    }
</script>
