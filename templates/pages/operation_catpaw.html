<div style="width:1024px; height:600px; background:#111827; display:flex; flex-direction:column; font-family: sans-serif; overflow:hidden;">
    <!-- Header -->
    <div style="height:72px; background:#E79124; flex-shrink:0; display:flex; align-items:center; justify-content:space-between; padding:0 32px;">
        <span style="font-size:1.8rem; font-weight:bold; color:white; letter-spacing:1px;">CATPAW Operation</span>
        <div style="color:white; font-size:1.3rem; font-weight:bold; background:rgba(0,0,0,0.2); padding:8px 20px; border-radius:12px;">
            ยอดเงินคงเหลือ: <span class="global-balance-display">0</span> THB
        </div>
    </div>

    <!-- Main Content Area -->
    <div style="flex:1; display:flex; padding:40px; gap:40px; overflow:hidden;">
        
        <!-- Left Column: Function List -->
        <div id="function-list" style="flex:1.2; display:flex; flex-direction:column; justify-content:center; gap:25px;">
            <!-- Circles rendered via JS -->
        </div>

        <!-- Right Column: Status & Timer -->
        <div style="flex:1; display:flex; flex-direction:column; gap:24px;">
            <!-- Big Box -->
            <div style="flex:1; background:#1E2836; border-radius:32px; border:1px solid #374151; display:flex; flex-direction:column; justify-content:center; align-items:center;">
                <span id="status-text" style="color:#9CA3AF; font-size:2rem; font-weight:bold; margin-bottom:15px; letter-spacing:2px; text-transform:uppercase;">Running</span>
                <div style="display:flex; align-items:baseline;">
                    <span id="main-timer" style="font-size:10rem; font-weight:bold; color:white; line-height:1; font-family:monospace;">--</span>
                    <span style="font-size:2rem; color:#9CA3AF; font-weight:bold; margin-left:15px; letter-spacing:2px;">SEC</span>
                </div>
                <div id="door-status" style="margin-top:10px; color:#EF4444; font-weight:bold; font-size:1.2rem; visibility:hidden;">DOOR OPENED</div>
            </div>

            <!-- Controls -->
            <div style="display:flex; gap:20px; height:120px;">
                <button id="btn-pause" onclick="cpTogglePause(this)" style="
                    flex:1; background:#F59E0B; border:none; border-radius:24px;
                    color:white; font-size:2rem; font-weight:bold; cursor:pointer;
                ">PAUSE</button>
                
                <button onclick="cpForceFinish()" style="
                    flex:1; background:#EF4444; border:none; border-radius:24px;
                    color:white; font-size:1.6rem; font-weight:bold; cursor:pointer;
                ">FINISH EARLY</button>
            </div>
        </div>
    </div>

    <!-- Finish overlay -->
    <div id="finish-overlay" style="display:none; position:absolute; inset:0; background:#111827; z-index:300; justify-content:center; align-items:center; flex-direction:column; gap:40px;">
        <h2 style="color:#10B981; font-size:6rem; font-weight:bold; letter-spacing:10px; margin:0;">COMPLETED</h2>
        <button style="background:#3B82F6; border:none; border-radius:16px; color:white; font-size:2rem; font-weight:bold; padding:20px 80px; cursor:pointer;" onclick="navTo('/page/home')">Return to Home</button>
    </div>
</div>

<style>
    .fn-row { display: flex; align-items: center; gap:30px; }
    .fn-circle {
        width: 50px; height: 50px; border-radius: 50%;
        background: #374151; border: 4px solid #1F2937;
        flex-shrink: 0;
    }
    .fn-text { color: white; font-size: 2.2rem; font-weight: bold; }
    .circle-running { background: #FBBF24 !important; border-color: #FDE047 !important; }
    .circle-finished { background: #10B981 !important; border-color: #34D399 !important; }
    * { transition: none !important; animation: none !important; }
</style>

<script>
    (function() {
        const fns = [
            {id:'uv_ozone', thai:'อบด้วยยูวีและโอโซน', match:'uv'},
            {id:'dust', thai:'เป่าฝุ่นด้วยแรงดันลม', match:'dust'},
            {id:'bact', thai:'ฆ่าเชื้อแบคทีเรีย', match:'bact'},
            {id:'dry', thai:'อบแห้งด้วยลมร้อน', match:'dry'},
            {id:'perfume', thai:'อบหมวกด้วยน้ำหอม', match:'perfume'}
        ];

        let timeLeft = 0;
        let isPaused = false;
        let timerStarted = false;
        let lastActionSeq = Date.now() / 1000; // Ignore history from previous sessions
        let lastSchedSeq = 0;

        // Render functions
        const container = document.getElementById('function-list');
        fns.forEach(f => {
            const div = document.createElement('div');
            div.className = 'fn-row';
            div.innerHTML = `<div class="fn-circle" id="circle-${f.id}"></div><span class="fn-text">${f.thai}</span>`;
            container.appendChild(div);
        });

        // Local Timer Logic
        const localTimer = setInterval(() => {
            if (timerStarted && !isPaused && timeLeft > 0) {
                timeLeft--;
                document.getElementById('main-timer').innerText = timeLeft;
                if (timeLeft <= 0) {
                    timerStarted = false;
                    document.getElementById('status-text').innerText = 'COMPLETED';
                    // Return to home properly
                    setTimeout(() => {
                        window.location.href = '/'; 
                    }, 3000);
                }
            }
        }, 1000);

        async function poll() {
            try {
                const res = await fetch('/api/action_state?t=' + Date.now());
                const d = await res.json();
                
                // 1. Schedule
                if (d.schedule_event && d.schedule_event.seq > lastSchedSeq) {
                    lastSchedSeq = d.schedule_event.seq;
                    const totalMatch = d.schedule_event.raw.match(/total:(\d+)/);
                    if (totalMatch) {
                        timeLeft = parseInt(totalMatch[1]);
                        document.getElementById('main-timer').innerText = timeLeft;
                        fetch('/api/uart_send?msg=[Action] Load Schedule Success');
                    }
                }

                // 2. Actions (Process History)
                const history = d.action_history || [];
                history.forEach(evt => {
                    if (evt.seq > lastActionSeq) {
                        lastActionSeq = evt.seq;
                        handleActionEvent(evt.name);
                    }
                });

                // 3. Overall State & Redirection Logic
                if (d.state_event && d.state_event.seq > lastSeenStateSeq) {
                    lastSeenStateSeq = d.state_event.seq;
                    if (d.state_event.name === 'Finish') {
                        document.getElementById('finish-overlay').style.display = 'flex';
                    } else if (d.state_event.name === 'Home') {
                        navTo('/page/home');
                    }
                }
            } catch(e){}
        }

        let lastSeenStateSeq = 0;
        fetch('/api/action_state').then(r=>r.json()).then(d => {
            if(d.state_event) lastSeenStateSeq = d.state_event.seq;
        }).catch(()=>{});

        function handleActionEvent(name) {
            const lowerName = name.toLowerCase();
            console.log("CATPAW Action Received:", name);
            
            if (name.includes('FnOn')) {
                timerStarted = true;
                setCircleState(name, 'circle-running');
            } else if (name.includes('FnOff')) {
                setCircleState(name, 'circle-finished');
            }
            
            if (lowerName.includes('pause') || lowerName.includes('door open')) {
                updatePauseUI(true, lowerName.includes('door open'));
            } else if (lowerName.includes('resume') || lowerName.includes('door close')) {
                updatePauseUI(false, false);
            }
        }

        function updatePauseUI(paused, door) {
            isPaused = paused;
            const btn = document.getElementById('btn-pause');
            const st = document.getElementById('status-text');
            const dr = document.getElementById('door-status');
            
            if (isPaused) {
                btn.innerText = 'RESUME';
                btn.style.background = '#10B981';
                st.innerText = 'PAUSED';
                dr.style.visibility = door ? 'visible' : 'hidden';
            } else {
                btn.innerText = 'PAUSE';
                btn.style.background = '#F59E0B';
                st.innerText = 'RUNNING';
                dr.style.visibility = 'hidden';
            }
        }

        function setCircleState(rawAction, className) {
            const lowerAction = rawAction.toLowerCase();
            fns.forEach(f => {
                // Precise match for "fn":"name" in JSON string
                const pattern = `\"fn\":\"${f.match}\"`;
                if (lowerAction.includes(pattern)) {
                    const circle = document.getElementById('circle-' + f.id);
                    circle.classList.remove('circle-running', 'circle-finished');
                    circle.classList.add(className);
                }
            });
        }

        window.cpTogglePause = (btn) => {
            // Immediate UI feedback for better UX
            const nextPaused = !isPaused;
            updatePauseUI(nextPaused, false);
            fetch('/api/uart_send?msg=[Action] ' + (nextPaused ? 'Pause' : 'Resume'));
        };

        window.cpForceFinish = () => {
            fetch('/api/uart_send?msg=[State] Finish');
            setTimeout(() => fetch('/api/uart_send?msg=[Action] Finish'), 50);
            document.getElementById('finish-overlay').style.display = 'flex';
        };

        const interval = setInterval(poll, 800);
        document.addEventListener('htmx:beforeSwap', () => {
            clearInterval(interval);
            clearInterval(localTimer);
        }, {once:true});
    })();

    function navTo(url) {
        htmx.ajax('GET', url, {target: '#content'});
    }
</script>
