<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HMI Kiosk</title>
    <script src="/static/js/htmx.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-user-select: none; font-family: sans-serif; }
        body { 
            background: #000000; color: white; 
            width: 1024px; height: 600px; 
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; 
        }
        #content { 
            width: 1024px; height: 600px; 
            background: #111827;
            position: relative;
        }
        .btn { 
            padding: 25px 50px; font-size: 2rem; border-radius: 20px; 
            border: none; cursor: pointer; transition: 0.2s; 
        }
        .btn-green { background: #00e676; color: black; font-weight: bold; }
        .btn-outline { background: transparent; border: 3px solid white; color: white; }
        .btn:active { filter: brightness(0.7); }
    </style>
</head>
<body hx-get="/page/home" hx-trigger="load" hx-target="#content">

    <div id="content"></div>

    <script>
        let currentDisplayedBalance = 0;
        let targetBalance = 0;
        let animationInterval = null;

        setInterval(async () => {
            try {
                const res = await fetch('/api/balance_html?t=' + Date.now(), {cache: 'no-store'});
                const text = await res.text();
                const newBalance = parseInt(text);
                if (!isNaN(newBalance) && newBalance !== targetBalance) {
                    targetBalance = newBalance;
                    if (newBalance < currentDisplayedBalance) {
                        currentDisplayedBalance = newBalance;
                        updateDisplays(currentDisplayedBalance);
                    } else if (!animationInterval) {
                        startAnimation();
                    }
                }
            } catch(e) {}
        }, 1000);

        function startAnimation() {
            animationInterval = setInterval(() => {
                if (currentDisplayedBalance < targetBalance) {
                    const diff = targetBalance - currentDisplayedBalance;
                    const step = Math.max(1, Math.floor(diff / 10));
                    currentDisplayedBalance += step;
                    if (currentDisplayedBalance > targetBalance) currentDisplayedBalance = targetBalance;
                    updateDisplays(currentDisplayedBalance);
                } else {
                    clearInterval(animationInterval);
                    animationInterval = null;
                }
            }, 50);
        }

        function updateDisplays(val) {
            const badges = document.querySelectorAll('.global-balance-display');
            badges.forEach(b => { b.innerText = val; });
            document.dispatchEvent(new CustomEvent('balanceAnimated', { detail: { balance: val } }));
        }

        document.body.addEventListener('htmx:afterSettle', function() {
            updateDisplays(currentDisplayedBalance);
        });
    </script>

    {% if is_dev %}
    <!-- Dev Balance Adjustment Panel -->
    <div onclick="event.stopPropagation()" style="position: fixed; bottom: 20px; left: 20px; z-index: 99999; display: flex; gap: 8px; background: rgba(17, 24, 39, 0.95); border: 2px dashed #e79124; border-radius: 16px; padding: 10px 16px; align-items: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); pointer-events: auto;">
        <span style="color: #e79124; font-size: 13px; font-weight: 800; font-family: sans-serif; letter-spacing: 1px; margin-right: 5px;">DEV MODE</span>
        <button onclick="adjustDevBalance(-10)" style="background: #374151; color: white; border: 1px solid #4b5563; padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; transition: 0.1s;" onmouseover="this.style.background='#4b5563'" onmouseout="this.style.background='#374151'">-10 THB</button>
        <button onclick="adjustDevBalance(10)" style="background: #10b981; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; transition: 0.1s;" onmouseover="this.style.background='#059669'" onmouseout="this.style.background='#10b981'">+10 THB</button>
    </div>
    <script>
        async function adjustDevBalance(amount) {
            try {
                await fetch('/api/dev/adjust_balance', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ amount: amount })
                });
            } catch(e) {
                console.error(e);
            }
        }
    </script>
    {% endif %}
</body>
</html>
